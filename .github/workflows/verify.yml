name: Verify isolated application
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:1/inst_acessor_audit
      DIRECT_URL: postgresql://audit:audit@127.0.0.1:1/inst_acessor_audit
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:schema
      - run: npm run verify:types
      - run: npm run verify:lint
      - run: npm run test:offline
      - run: npm run test:integration
      - run: npm run verify:build
      - run: npx playwright install --with-deps chromium
      - run: node bench/safe-run.mjs e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-evidence
          path: |
            outputs/verification
            outputs/screenshots
          retention-days: 7
